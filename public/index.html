<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quickie - Instant Chat</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container">

        <!-- ===== PAIRING SCREEN ===== -->
        <div id="pairingScreen" class="pairing-screen">
            <button id="darkModeToggle" class="dark-mode-toggle">🌙</button>
            <div id="logo" class="logo">Quick<span>ie</span></div>
            <p class="subtitle">Instant private chat · No sign-up required</p>
            <div id="otpDisplay" class="otp-display"></div>
            <button id="createBtn" class="btn btn-primary btn-block">🚀 Start Quick Chat</button>
            <div class="pairing-divider">
                <hr /> or join with code
                <hr />
            </div>
            <div class="input-group">
                <input type="text" id="otpInput" maxlength="6" placeholder="6-digit code" inputmode="numeric" />
                <button id="joinBtn" class="btn btn-success">Join</button>
            </div>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <!-- ===== CHAT SCREEN (Sidebar + Main Chat) ===== -->
        <div id="chatScreen" class="chat-screen">

            <!-- Sidebar -->
            <div id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-logo">Quick<span>ie</span></span>
                    <button id="sidebarCloseBtn" class="sidebar-close">✕</button>
                </div>
                <div class="sidebar-search">
                    <input type="text" placeholder="Search chats..." id="sidebarSearch" />
                </div>
                <div id="chatList" class="chat-list">
                    <!-- Chat items will be rendered here -->
                </div>
                <div class="sidebar-footer">
                    <button id="newChatBtn" class="new-chat-btn">➕ New Chat</button>
                </div>
            </div>

            <!-- Sidebar Overlay (mobile) -->
            <div id="sidebarOverlay" class="sidebar-overlay"></div>

            <!-- Main Chat Area -->
            <div class="main-chat">
                <!-- Chat Header -->
                <div class="chat-header">
                    <button id="sidebarToggle" class="sidebar-toggle">☰</button>
                    <div class="header-left">
                        <span id="partnerName" class="partner-name">Select a chat</span>
                        <span id="statusDot" class="status-dot offline"></span>
                        <span id="statusText" class="status-text">Offline</span>
                    </div>
                    <div class="header-right">
                        <button id="searchBtn" class="header-btn" title="Search Messages">🔍</button>
                        <button id="refreshBtn" class="header-btn" title="Refresh Chat">🔄</button>
                        <span class="badge">● Live</span>
                        <button id="leaveBtn" class="leave-btn">✕ Leave</button>
                    </div>
                </div>

                <!-- Search Bar -->
                <div id="searchBar" class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search messages..." />
                    <button id="searchCloseBtn" class="search-close">✕</button>
                    <div id="searchResults" class="search-results"></div>
                </div>

                <!-- Messages Area -->
                <div id="messageList" class="chat-messages"></div>
                <div id="typingIndicator" class="typing-indicator"></div>

                <!-- Quick Replies -->
                <div id="quickReplies" class="quick-replies">
                    <button class="quick-reply" data-text="OK 👍">OK 👍</button>
                    <button class="quick-reply" data-text="On my way! 🚀">On my way! 🚀</button>
                    <button class="quick-reply" data-text="Got it! ✅">Got it! ✅</button>
                    <button class="quick-reply" data-text="Thank you! 🙏">Thank you! 🙏</button>
                    <button class="quick-reply" data-text="😂 That's funny">😂 That's funny</button>
                    <button class="quick-reply" data-text="❤️ Love it">❤️ Love it</button>
                </div>

                <!-- Chat Input Area (New Design) -->
                <div class="chat-input-area">
                    <!-- Text Input Row -->
                    <div class="input-row">
                        <textarea id="chatInput" placeholder="Type a message..." rows="1" maxlength="1000"></textarea>
                        <button id="sendBtn" class="send-btn">Send</button>
                    </div>
                    <!-- Toolbar Row -->
                    <div class="toolbar-row">
                        <button id="emojiBtn" class="icon-btn" title="Emoji">😊</button>
                        <button id="imageBtn" class="icon-btn" title="Image">📎</button>
                        <button id="voiceBtn" class="icon-btn" title="Voice">🎤</button>
                        <button id="fileBtn" class="icon-btn" title="File">📄</button>
                    </div>
                    <input type="file" id="fileInput" style="display:none" />
                    <input type="file" id="imageInput" accept="image/*" style="display:none" />
                </div>

                <!-- Emoji Picker -->
                <div id="emojiPicker" class="emoji-picker">
                    <button>😀</button><button>😂</button><button>🤣</button>
                    <button>❤️</button><button>😍</button><button>🥰</button>
                    <button>👍</button><button>👎</button><button>👏</button>
                    <button>🎉</button><button>🔥</button><button>💯</button>
                    <button>😊</button><button>😎</button><button>🤗</button>
                    <button>😘</button><button>😁</button><button>😅</button>
                    <button>🤔</button><button>😳</button><button>😭</button>
                    <button>💀</button><button>✨</button><button>🌟</button>
                    <button>🙏</button><button>🤝</button><button>💪</button>
                    <button>🚀</button><button>⭐</button><button>💖</button>
                </div>
            </div>
        </div>

        <!-- ===== MODALS ===== -->

        <!-- Image Viewer Modal -->
        <div id="imageModal" class="image-modal">
            <span id="closeModal" class="close-modal">&times;</span>
            <img id="modalImage" class="modal-image" src="" alt="Enlarged image" />
            <a id="downloadBtn" class="download-btn" download>📥 Download</a>
        </div>

        <!-- Voice Recording Modal -->
        <div id="voiceModal" class="voice-modal">
            <div class="voice-modal-content">
                <h3>🎤 Recording...</h3>
                <div class="voice-wave">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <div id="voiceTimer" class="voice-timer">0:00</div>
                <div class="voice-actions">
                    <button id="stopRecordingBtn" class="btn btn-danger">⏹ Stop</button>
                    <button id="cancelRecordingBtn" class="btn btn-secondary">✕ Cancel</button>
                </div>
            </div>
        </div>

        <!-- Audio Player Modal -->
        <div id="audioPlayerModal" class="audio-player-modal">
            <div class="audio-player-content">
                <h3>🎵 Voice Message</h3>
                <audio id="audioPlayer" controls></audio>
                <button id="closeAudioBtn" class="btn btn-secondary">Close</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
